<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="script.js" defer></script>

<style>
body{background:#0a0a0a;color:white;font-family:Arial;}
.navbar{background:rgba(0,0,0,0.85);}
.navbar-brand{color:#ff2e2e!important;font-weight:bold;}
.glow{text-shadow:0 0 10px rgba(255,46,46,.6);}
.gym-card{background:rgba(255,255,255,.05);border-radius:20px;padding:25px;}
input,textarea{width:100%;margin-top:10px;padding:10px;border-radius:8px;border:none;}
button{background:#ff2e2e;color:white;padding:10px;border:none;margin-top:10px;width:100%;}
</style>
</head>

<body>

<nav class="navbar navbar-dark">
<div class="container">
<a class="navbar-brand glow" href="index.html">JOHN'S GYM</a>
</div>
</nav>

<div class="container py-5">

<h1 class="glow">Contact</h1>

<div class="gym-card">

<form onsubmit="return validateForm()">

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<textarea id="message" placeholder="Message"></textarea>

<button>Send</button>
<p id="error"></p>

</form>

</div>

</div>

</body>
</html>
