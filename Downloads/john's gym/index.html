<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John's Gym</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="script.js" defer></script>

<style>

body{
  background:#0a0a0a;
  color:white;
  font-family:Arial;
  margin:0;
}

/* NAV */
.navbar{
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(10px);
}

.navbar-brand{
  color:#ff2e2e !important;
  font-weight:bold;
}

/* GLOW */
.glow{
  text-shadow:0 0 10px rgba(255,46,46,0.6),
              0 0 25px rgba(255,46,46,0.3);
}

/* HERO */
.hero{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:radial-gradient(circle,#1a1a1a,#0a0a0a);
}

/* CARDS */
.gym-card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,46,46,0.2);
  border-radius:25px;
  padding:25px;
  transition:all .3s ease;
  height:100%;
}

.gym-card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 0 30px rgba(255,46,46,.45);
}

.gym-card img{
  width:100%;
  height:180px;
  object-fit:contain;
  margin-bottom:10px;
}

.btn-custom{
  background:#ff2e2e;
  color:white;
  padding:12px 25px;
  border:none;
}

.btn-custom:hover{
  box-shadow:0 0 15px rgba(255,46,46,0.5);
}

</style>
</head>

<body onload="showGreeting()">

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand glow" href="#">JOHN'S GYM</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
</ul>
</div>

</div>
</nav>

<section class="hero">
<div>
<h1 class="glow">BUILD YOUR STRONGER SELF</h1>
<p id="greeting"></p>
<a href="about.html" class="btn btn-custom mt-3">Explore</a>
</div>
</section>

<section class="container py-5">
<div class="row g-4">

<div class="col-md-4">
<div class="gym-card">
<img src="images/weight.png">
<h4 class="glow">Weight Training</h4>
<p>Build strength and muscle effectively.</p>
</div>
</div>

<div class="col-md-4">
<div class="gym-card">
<img src="images/cardio.png">
<h4 class="glow">Cardio Burn</h4>
<p>Improve endurance and burn fat.</p>
</div>
</div>

<div class="col-md-4">
<div class="gym-card">
<img src="images/coaching.png">
<h4 class="glow">Personal Coaching</h4>
<p>1-on-1 training programs.</p>
</div>
</div>

</div>
</section>

</body>
</html>
